# roster.conf — the ONE place a model or effort is set on this machine.
# Named .conf, not .env: tool permission heuristics (opencode's read deny for
# *.env, .gitignore templates, secret scanners) treat any .env suffix as a
# secrets file.
# Shell-sourceable KEY=VALUE, no quotes, no expansions. Read, never sourced,
# and always through bin/roster-get — the one reader every consumer goes
# through, so a malformed line, a duplicate key or an empty value fails the
# same way everywhere. Its consumers: bin/roster-render writes agents/*.md
# frontmatter from it, bin/doctor verifies against it, the opus-build review
# wrappers read it, and the opus-build Codex lane passes CODEX_* as explicit
# flags.
# Value forms are per key — each takes exactly what its consumer's own flag or
# field takes, documented in the section below it. Anthropic keys use aliases
# so the whole roster moves to the latest release together; put a full id in
# the same key to pin an exact version.
# After editing: run bin/roster-render, then bin/doctor. ROSTER.md explains
# the roles; it holds no values.

# Agent-tool roles. *_MODEL is written into Claude Code agent frontmatter
# (`model:`) and takes an alias — opus, sonnet, haiku, fable — or a full model
# id such as claude-opus-5: the same value set as the --model flag.
# *_EFFORT: low, medium, high, xhigh or max; which levels exist depends on the
# model.
BUILDER_MODEL=opus
BUILDER_EFFORT=xhigh
RESEARCHER_MODEL=opus
RESEARCHER_EFFORT=xhigh
# SCOUT_MODEL is narrower: it is passed as the Agent tool's `model` override,
# whose schema is an enum of aliases only (sonnet, opus, haiku, fable). A full
# model id is NOT accepted here. Its consumer is the orchestrator's
# Explore/general-purpose dispatch in opus-build Phase 1 — prompt-enforced, the
# same way the Codex lane's CODEX_* flags are.
SCOUT_MODEL=sonnet

# Reviewer portfolio
# Opus lane: one pair serves both paths — the in-session `opus-reviewer` agent
# frontmatter and the headless wrapper's `claude -p --model/--effort`. Same
# value forms as the agent-tool roles above.
OPUS_REVIEWER_MODEL=opus
OPUS_REVIEWER_EFFORT=xhigh
# Codex lane (ChatGPT plan billing). Passed as --model/--effort so the lane
# never inherits ~/.codex/config.toml. CODEX_MODEL is a Codex model slug, e.g.
# gpt-6-astra; Codex has no "latest" alias — the plugin maps only `spark`, to
# gpt-5.3-codex-spark — so this key always names an exact model.
# CODEX_EFFORT: none, minimal, low, medium, high or xhigh.
CODEX_MODEL=gpt-6-astra
CODEX_EFFORT=high
# Kimi K3 lane via opencode. K3_MODEL is an opencode provider/model slug, as
# listed by `opencode models`. K3_VARIANT is opencode's `--variant`
# (provider-specific reasoning effort); empty means omit the flag and take
# the provider default.
K3_MODEL=kimi-code-plan-global/k3
K3_VARIANT=
