# roster.conf — the ONE place a model or effort is set on this machine.
# Named .conf, not .env: tool permission heuristics (opencode's read deny for
# *.env, .gitignore templates, secret scanners) treat any .env suffix as a
# secrets file.
# Shell-sourceable KEY=VALUE, no quotes, no expansions. Read, never sourced,
# and always through bin/roster-get — the one reader every consumer goes
# through, so a malformed line, a duplicate key or an empty value fails the
# same way everywhere. Its consumers: bin/roster-render writes agents/*.md
# frontmatter from it and renders the Codex agent files (CODEX_*), bin/doctor
# verifies against it, the delegate-build review wrappers read it, and the
# delegate-build GPT lane (reached through Codex) passes GPT_REVIEWER_* as
# explicit flags.
# Value forms are per key — each takes exactly what its consumer's own flag or
# field takes, documented in the section below it. Anthropic keys use aliases
# so the whole roster moves to the latest release together; put a full id in
# the same key to pin an exact version.
# After editing: run bin/roster-render, then bin/doctor. CODEX_* edits reach
# Codex only through bin/install (--codex the first time), which renders
# ~/.codex/agents/*.toml; doctor reports them as drift until then. ROSTER.md
# explains the roles; it holds no values.

# Agent-tool roles. *_MODEL is written into Claude Code agent frontmatter
# (`model:`) and takes an alias — opus, sonnet, haiku, fable — or a full model
# id such as claude-opus-5: the same value set as the --model flag.
# *_EFFORT: low, medium, high, xhigh or max; which levels exist depends on the
# model. Roles: BUILDER is the `delegate-builder` agent, RESEARCHER the
# `researcher` agent, SCOUT the `scout` agent.
BUILDER_MODEL=sonnet
BUILDER_EFFORT=xhigh
RESEARCHER_MODEL=opus
RESEARCHER_EFFORT=xhigh
# SCOUT_MODEL and SCOUT_EFFORT are written into agents/scout.md frontmatter by
# bin/roster-render like the other agent-tool roles, so SCOUT_MODEL takes the
# same value forms as they do (an alias or a full model id), not the Agent
# tool's alias-only `model` override enum.
SCOUT_MODEL=sonnet
SCOUT_EFFORT=high

# Reviewer portfolio. Lanes are named by model family, not by the model inside
# or the access path: the portfolio is diversity by lineage, and both the model
# and the path churn.
# Claude lane: one pair serves both paths — the in-session `claude-reviewer`
# agent frontmatter and the headless wrapper's `claude -p --model/--effort`.
# Same value forms as the agent-tool roles above.
CLAUDE_REVIEWER_MODEL=opus
CLAUDE_REVIEWER_EFFORT=xhigh
# GPT lane, reached through Codex (ChatGPT plan billing). Passed as
# --model/--effort so the lane never inherits ~/.codex/config.toml.
# GPT_REVIEWER_MODEL is a Codex model slug, e.g. gpt-6-astra; Codex has no
# "latest" alias — the plugin maps only `spark`, to gpt-5.3-codex-spark — so
# this key always names an exact model.
# GPT_REVIEWER_EFFORT: none, minimal, low, medium, high or xhigh.
GPT_REVIEWER_MODEL=gpt-6-astra
GPT_REVIEWER_EFFORT=high
# Kimi lane via opencode. KIMI_REVIEWER_MODEL is an opencode provider/model
# slug, as listed by `opencode models`. KIMI_REVIEWER_VARIANT is opencode's
# `--variant` (provider-specific reasoning effort); empty means omit the flag
# and take the provider default.
KIMI_REVIEWER_MODEL=kimi-code-plan-global/k3
KIMI_REVIEWER_VARIANT=

# Codex roles: the same three workers as the agent-tool roles above, as Codex
# agents in ~/.codex/agents/{delegate-builder,scout,researcher}.toml.
# bin/roster-render --codex renders them from these keys and agents/*.md;
# bin/install --codex installs them, plain bin/install refreshes them.
# CODEX_*_MODEL is an exact Codex model slug, e.g. gpt-6.1-sol: Codex has no
# "latest" alias. CODEX_*_EFFORT is a reasoning level the model accepts, among
# none, minimal, low, medium, high, xhigh or max; Codex validates it at spawn.
# Roles: BUILDER is the `delegate-builder` agent, SCOUT the `scout` agent,
# RESEARCHER the `researcher` agent.
CODEX_BUILDER_MODEL=gpt-6.1-sol
CODEX_BUILDER_EFFORT=high
CODEX_SCOUT_MODEL=gpt-6.1-sol
CODEX_SCOUT_EFFORT=medium
CODEX_RESEARCHER_MODEL=gpt-6-astra
CODEX_RESEARCHER_EFFORT=xhigh
